name: Developer docs

# developers.schellingboard.org documents the default branch, not a release, so
# like the landing page it publishes from main rather than from tags. See
# docs/dev/adr/0008-publish-developer-docs.md.
#
# GitHub Pages serves one custom domain per repository and docs.schellingboard.org
# already uses this one, so the built site is pushed to
# schellingboard/developers.schellingboard.org, which holds nothing else.
on:
  push:
    branches:
      - main
    paths:
      - "docs/dev/**"
      - "docs/logo/**"
      - "docmd.dev.config.json"
      - "scripts/build-dev-docs.sh"
      - "scripts/likec4-embed.js"
      - "scripts/docmd-git-history.js"
      - ".github/workflows/developers.yml"
  workflow_dispatch:

# Two deploys racing would push conflicting commits to the site repository.
concurrency:
  group: developers
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7.0.1
        with:
          # Every page is dated from the commit that last touched it, which a
          # shallow clone can't answer. The build fails on an undated page.
          fetch-depth: 0

      - name: Install bun
        uses: oven-sh/setup-bun@v2

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Build site
        run: make docs-dev-build

      # A GitHub App rather than a deploy key or a personal access token: the
      # token below expires within the hour, the app is owned by the
      # organization instead of a person, and it is installed on the two site
      # repositories alone. The landing page uses the same app; see
      # docs/dev/documentation.md § Hosting setup for the pushed sites.
      - name: Mint a token for the site repository
        id: token
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ vars.PAGES_DEPLOY_APP_CLIENT_ID }}
          private-key: ${{ secrets.PAGES_DEPLOY_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: developers.schellingboard.org
          # Narrower than whatever the installation is granted, so widening the
          # app later does not silently widen this job. The action revokes the
          # token when the job ends.
          permission-contents: write

      - name: Publish to schellingboard/developers.schellingboard.org
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          APP_SLUG: ${{ steps.token.outputs.app-slug }}
        run: |
          set -euo pipefail

          # The site repository is public, so only the push needs the token.
          # Cloning anonymously and passing it as a one-off header keeps it out
          # of the checkout's .git/config, which a URL-embedded token would not.
          git clone --depth 1 https://github.com/schellingboard/developers.schellingboard.org.git target

          # --delete so a removed page disappears from the site;
          # --exclude .git so the clone survives it.
          rsync -a --delete --exclude .git dev-site/ target/

          cd target
          # Name the app that actually pushed, so the site repository's history
          # says where its commits come from.
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${APP_SLUG}[bot]@users.noreply.github.com"
          git add -A

          # A push touching docs/dev/ that changes nothing in the output (a
          # reordered path filter, a reverted edit) should not leave an empty
          # commit behind.
          if git diff --cached --quiet; then
            echo "Site output unchanged — nothing to publish."
            exit 0
          fi

          git commit -m "Deploy ${GITHUB_REPOSITORY}@${GITHUB_SHA:0:7}"

          AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.extraheader=Authorization: Basic ${AUTH}" push
