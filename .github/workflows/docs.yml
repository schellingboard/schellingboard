name: Docs

# The site is built from released versions only, so it changes when a release
# is tagged or when published docs are corrected on a release/<id> branch.
# Pushes to main deliberately do not publish: docs/public is the next release's
# documentation, previewed locally with `make docs`.
on:
  push:
    tags:
      - "v*"
    branches:
      - "release/*"
  workflow_dispatch:

# Only one deploy at a time; don't cancel a running one mid-upload.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Every published version is checked out from a tag or a release/<id>
          # branch during the build, and the git plugin renders per-page commit
          # history — none of which works from a shallow, single-ref clone.
          fetch-depth: 0

      - name: Install bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Build docs
        run: make docs-build

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
