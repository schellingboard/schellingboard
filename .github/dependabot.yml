version: 2
updates:
  # Enable version updates for npm
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    assignees:
      - "omarkohl"
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
      include: "scope"
    ignore:
      # eslint-plugin-react not yet compatible with eslint 10 (issue #380)
      - dependency-name: "eslint"
        versions: [">= 10"]
      # typescript-eslint not yet compatible with typescript 7 (issue #621)
      - dependency-name: "typescript"
        versions: [">= 7"]
    cooldown:
      default-days: 7
    groups:
      all-dependencies:
        patterns:
          - "*"

  # Enable version updates for the mailpit image in docker-compose.dev.yml.
  # Workflow `services:` images are out of Dependabot's reach
  # (dependabot-core#5819), which is why CI starts mailpit from the compose file.
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    assignees:
      - "omarkohl"
    commit-message:
      prefix: "deps"
      include: "scope"
    ignore:
      # Our own image in docker-compose.yml. Self-hosters choose the tag via
      # SCHELLINGBOARD_VERSION; it is not a dependency to bump here.
      - dependency-name: "schellingboard/schellingboard"
    cooldown:
      default-days: 7
    groups:
      all-dependencies:
        patterns:
          - "*"

  # Base images in the Dockerfile. Its tags float, so in practice this proposes
  # a new Node major, and its pull request runs the image scan.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    assignees:
      - "omarkohl"
    commit-message:
      prefix: "deps"
      include: "scope"
    cooldown:
      default-days: 7
    groups:
      all-dependencies:
        patterns:
          - "*"

  # Enable version updates for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    assignees:
      - "omarkohl"
    commit-message:
      prefix: "ci"
      include: "scope"
    cooldown:
      default-days: 7
    groups:
      all-dependencies:
        patterns:
          - "*"
