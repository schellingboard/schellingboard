app = "schellingboard-demo"
primary_region = "fra"

[env]
  SB_DEMO_RESET_AT = "03:00"
  # Fly's proxy puts two entries in X-Forwarded-For: the visitor, then the app's address.
  SB_TRUSTED_PROXIES = "2"
  SITE_URL = "https://demo.schellingboard.org"

[mounts]
  source = "demo_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/api/health"
    interval = "30s"
    timeout = "10s"
    grace_period = "60s"

# The scheduled reset exits with code 0, which the default on-failure policy
# would not restart.
[[restart]]
  policy = "always"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
